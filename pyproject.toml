[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exoal"
version = "1.1.0"
description = "Dynamic Python client for AI APIs with live model discovery and switching"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.scripts]
exoal = "exoal.cli:main"

[tool.setuptools]
packages = ["exoal"]
